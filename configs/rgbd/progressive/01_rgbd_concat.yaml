# Step 1: RGB-D with Simple Concat Fusion
#
# Adds depth encoder and simple concatenation fusion.
# First step in multimodal learning - late fusion approach.
# Establishes whether depth helps before adding complexity.
#
# Changes from 00_baseline:
#   + Dual encoder backbone (separate RGB and Depth ResNet50)
#   + Simple concat fusion at FPN level
#   + Depth data loading
#
# Command: python tools/train_rgbd.py --config-file configs/rgbd/progressive/01_rgbd_concat.yaml

_BASE_: "../Base_RGBD.yaml"

MODEL:
  META_ARCHITECTURE: "RCNN3D_RGBD"
  
  # Enable dual encoder
  USE_DUAL_ENCODER: True
  
  # RGB encoder: fully frozen (dgmmod: frozen_stages=4 = all stages)
  RGB_RESNET_DEPTH: 50
  RGB_FROZEN: True
  RGB_FROZEN_STAGES: 4  # Freeze stages 0-4 (conv1, layer1-4)
  
  # Depth encoder: partially frozen (dgmmod: frozen_stages=2)
  DEPTH_RESNET_DEPTH: 50
  DEPTH_FROZEN: False
  DEPTH_FROZEN_STAGES: 2  # Freeze stages 0-2, train layer3-4
  
  # Simple concat fusion (baseline multimodal)
  FUSION_TYPE: "concat"

# Standard training setup
# Inherits base scaling from Base_RGBD.yaml (batch=16, lr=0.01)
SOLVER:
  IMS_PER_BATCH: 16   # 4 per GPU × 4 GPUs
  BASE_LR: 0.01       # From Base_RGBD scaling
  MAX_ITER: 200000    # ~200k iterations

OUTPUT_DIR: "./output/01_rgbd_concat"
