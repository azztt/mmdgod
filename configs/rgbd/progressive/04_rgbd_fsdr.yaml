# Step 4: Add FSDR (Frequency Space Domain Randomization)
#
# Introduces domain generalization through frequency-based augmentation.
# FSDR applies histogram matching on DCT frequency bands to simulate
# diverse domain shifts while preserving semantic structure.
#
# Changes from 03_rgbd_windowed:
#   + FSDR augmentation enabled
#   + DCT-based frequency manipulation
#   + Histogram matching on variant bands
#
# Command: python tools/train_rgbd.py --config-file configs/rgbd/progressive/04_rgbd_fsdr.yaml

_BASE_: "../Base_RGBD.yaml"

MODEL:
  META_ARCHITECTURE: "RCNN3D_RGBD"
  
  USE_DUAL_ENCODER: True
  
  # RGB encoder: fully frozen (dgmmod: frozen_stages=4)
  RGB_RESNET_DEPTH: 50
  RGB_FROZEN: True
  RGB_FROZEN_STAGES: 4
  
  # Depth encoder: partially frozen (dgmmod: frozen_stages=2)
  DEPTH_RESNET_DEPTH: 50
  DEPTH_FROZEN: False
  DEPTH_FROZEN_STAGES: 2
  
  # Gated fusion (stable choice for DG experiments)
  FUSION_TYPE: "gated"

# Domain generalization augmentations
DG:
  ENABLED: True
  
  # Frequency Space Domain Randomization
  FSDR:
    ENABLED: True
    PROBABILITY: 0.5
    # Variant bands: low frequencies (0-2) + high frequencies (32-64)
    VARIANT_BANDS: [[0, 2], [32, 64]]
    BLOCK_SIZE: 64
  
  # Object Style Swap (disabled for now)
  OBJECT_STYLE_SWAP:
    ENABLED: False

# Training settings - gated fusion + augmentation
SOLVER:
  IMS_PER_BATCH: 16
  BASE_LR: 0.01
  MAX_ITER: 200000

OUTPUT_DIR: "./output/04_rgbd_fsdr"
