# Step 2: RGB-D with Gated Fusion
#
# Upgrades fusion from simple concat to learned gating mechanism.
# Gated fusion dynamically weighs RGB vs depth contributions.
#
# Changes from 01_rgbd_concat:
#   + Gated fusion instead of concat
#   + Cross-attention mechanism for modal weighting
#   + Modality-specific gates
#
# Command: python tools/train_rgbd.py --config-file configs/rgbd/progressive/02_rgbd_gated.yaml

_BASE_: "../Base_RGBD.yaml"

MODEL:
  META_ARCHITECTURE: "RCNN3D_RGBD"
  
  USE_DUAL_ENCODER: True
  
  # RGB encoder: fully frozen (dgmmod: frozen_stages=4)
  RGB_RESNET_DEPTH: 50
  RGB_FROZEN: True
  RGB_FROZEN_STAGES: 4
  
  # Depth encoder: partially frozen (dgmmod: frozen_stages=2)
  DEPTH_RESNET_DEPTH: 50
  DEPTH_FROZEN: False
  DEPTH_FROZEN_STAGES: 2
  
  # Gated fusion with learned attention
  FUSION_TYPE: "gated"
  
  # Gated fusion hyperparameters
  FUSION:
    GATED:
      REDUCTION: 16
      NUM_HEADS: 8
      USE_CROSS_ATTENTION: True

# Training settings - gated fusion has similar memory footprint
SOLVER:
  IMS_PER_BATCH: 16
  BASE_LR: 0.01
  MAX_ITER: 200000

OUTPUT_DIR: "./output/02_rgbd_gated"
