# Step 6: Full Domain Generalization Stack
#
# Complete RGB-D domain generalization configuration with all components:
# - Dual encoder backbone (RGB + Depth)
# - Adaptive MultiMAE-style windowed attention fusion
# - FSDR augmentation
# - Object Style Swap augmentation
# - Depth dropout for modality robustness
#
# This is the recommended production config for cross-domain transfer.
#
# Command: python tools/train_rgbd.py --config-file configs/rgbd/progressive/06_rgbd_full_dg.yaml

_BASE_: "../Base_RGBD.yaml"

MODEL:
  META_ARCHITECTURE: "RCNN3D_RGBD"
  
  USE_DUAL_ENCODER: True
  
  # RGB encoder: fully frozen (dgmmod: frozen_stages=4 = all stages)
  # Rationale: Pretrained RGB features are domain-invariant
  RGB_RESNET_DEPTH: 50
  RGB_FROZEN: True
  RGB_FROZEN_STAGES: 4  # Freeze stages 0-4 (conv1, layer1-4)
  
  # Depth encoder: partially frozen (dgmmod: frozen_stages=2)
  # Rationale: Early layers learn general gradients, later layers adapt to depth
  DEPTH_RESNET_DEPTH: 50
  DEPTH_FROZEN: False
  DEPTH_FROZEN_STAGES: 2  # Freeze stages 0-2, train layer3-4
  
  # Advanced windowed attention fusion
  FUSION_TYPE: "windowed"
  
  FUSION:
    WINDOWED:
      NUM_HEADS: 8
      NUM_BLOCKS: 2
      BASE_WINDOW_SIZE: 7
      MLP_RATIO: 4.0
      DROPOUT: 0.1
      FUSION_MODE: "concat_proj"

# Full domain generalization augmentation stack
DG:
  ENABLED: True
  
  # Frequency Space Domain Randomization
  FSDR:
    ENABLED: True
    PROBABILITY: 0.5
    VARIANT_BANDS: [[0, 2], [32, 64]]
    BLOCK_SIZE: 64
  
  # Object-wise style transfer
  OBJECT_STYLE_SWAP:
    ENABLED: True
    PROBABILITY: 0.3
    BLEND_MODE: "alpha"
    ALPHA: 0.7
    MIN_AREA: 100
  
  # Depth dropout for modality robustness
  DEPTH_DROPOUT:
    ENABLED: True
    PROBABILITY: 0.1  # 10% chance to zero out depth

# Training settings
# Inherits base scaling from Base_RGBD.yaml
# Windowed attention requires more memory, reduce batch to 12
# Scale factor r = 128 / 12 ≈ 10.67
SOLVER:
  IMS_PER_BATCH: 12   # Reduced for windowed attention memory
  BASE_LR: 0.0075     # 0.08 / 10.67
  STEPS: (150000, 200000)  # Adjusted for 250k iters
  MAX_ITER: 250000    # Longer training for full DG stack
  WARMUP_ITERS: 6250  # 2.5% of max_iter

TEST:
  EVAL_PERIOD: 25000  # Evaluate every 25k iters

VIS_PERIOD: 2500

OUTPUT_DIR: "./output/06_rgbd_full_dg"
