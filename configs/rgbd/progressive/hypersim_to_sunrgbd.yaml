# Hypersim → SUNRGBD Cross-Domain Transfer Configuration
#
# Training: Hypersim (synthetic indoor)
# Evaluation: SUNRGBD (real indoor)
#
# This config applies the full DG stack for maximum domain transfer.
# Use this for the main cross-domain generalization experiments.
#
# Command: python tools/train_rgbd.py --config-file configs/rgbd/progressive/hypersim_to_sunrgbd.yaml

_BASE_: "06_rgbd_full_dg.yaml"

# Dataset configuration
DATASETS:
  # Data paths (inherited DATA_ROOT and MANIFEST_ROOT from Base_RGBD.yaml)
  # DATA_ROOT: /mnt/data/users/anweshan/omni3d/data
  # MANIFEST_ROOT: /mnt/data/users/anweshan/omni3d/data/unidet3d_format/cleaned_manifests
  
  # Train on Hypersim (synthetic indoor)
  # Use sampled manifest for faster debugging (500 images)
  TRAIN: ("hypersim_train_rgbd",)
  TRAIN_MANIFEST: "hypersim_train_sampled.json"  # Switch to hypersim_train_filtered.json for full training
  
  # Evaluate on SUNRGBD (real indoor) for domain transfer assessment
  VAL: ("sunrgbd_val_rgbd",)
  VAL_MANIFEST: "sunrgbd_val_filtered.json"
  
  TEST: ("sunrgbd_val_rgbd",)
  TEST_MANIFEST: "sunrgbd_val_filtered.json"

# Adjusted training for cross-domain
# Scale: r = 128/8 = 16
# BASE_LR = 0.08 / 16 = 0.005
SOLVER:
  IMS_PER_BATCH: 8    # Conservative for cross-domain experiments
  BASE_LR: 0.005      # 0.08 / 16 (properly scaled)
  MAX_ITER: 300000    # Longer training for domain transfer
  STEPS: (180000, 240000)  # 60% and 80% of max_iter
  WARMUP_ITERS: 7500  # 2.5% of max_iter

# More frequent evaluation for cross-domain monitoring
TEST:
  EVAL_PERIOD: 15000  # Evaluate every 15k iters

OUTPUT_DIR: "./output/hypersim_to_sunrgbd"
