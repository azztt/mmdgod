# Base configuration for RGB-D domain-generalized 3D detection
# Uses Pure DETR3D architecture with learnable queries (no RPN)

_BASE_: "../Base.yaml"

# Override model to use Pure DETR3D architecture
MODEL:
  META_ARCHITECTURE: "PureDETR3D"
  
  # ---------------------------
  # DINOv3 Backbone Settings
  # ---------------------------
  BACKBONE:
    NAME: "build_dino_dual_encoder"
    DINO_MODEL: "dinov3-vitb16"  # Base model (768 dim, patch_size=16)
    RGB_FREEZE_ALL: False  # Train RGB encoder
    DEPTH_NUM_FROZEN_BLOCKS: 2  # Only freeze first 2 blocks
    FUSION_TYPE: "concat"
    OUT_CHANNELS: 256
  
  # Pixel normalization for DINO (ImageNet stats)
  PIXEL_MEAN: [123.675, 116.28, 103.53]
  PIXEL_STD: [58.395, 57.12, 57.375]
  
  # Depth normalization
  DEPTH_PIXEL_MEAN: 0.0
  DEPTH_PIXEL_STD: 1.0
  DEPTH_MAX: 20.0
  
  # ROI heads (just for NUM_CLASSES)
  ROI_HEADS:
    NUM_CLASSES: 31  # Hypersim categories
  
  # ---------------------------
  # Pure DETR3D Decoder Settings
  # ---------------------------
  ROI_CUBE_HEAD:
    # DETR decoder architecture
    FEATURE_DIM: 256
    NUM_QUERIES: 100        # Learnable object queries
    NUM_DECODER_LAYERS: 6   # Transformer decoder layers
    NUM_HEADS: 8
    DIM_FEEDFORWARD: 1024
    DROPOUT: 0.1
    
    # 3D detection settings
    POSE_TYPE: "6d"
    Z_TYPE: "direct"
    VIRTUAL_DEPTH: True
    VIRTUAL_FOCAL: 512.0
    ALLOCENTRIC_POSE: True
    
    # Loss weights
    LOSS_W_CLS: 2.0
    LOSS_W_XY: 1.0
    LOSS_W_Z: 1.0
    LOSS_W_DIMS: 1.0
    LOSS_W_POSE: 1.0
    LOSS_W_JOINT: 0.25
    
    # Test/Inference settings
    TEST_SCORE_THRESH: 0.05
    TEST_NMS_THRESH: 0.5
    TEST_TOPK_PER_IMAGE: 100

# Input settings - match Omni3D multi-scale training
INPUT:
  MIN_SIZE_TRAIN: (256, 288, 320, 352, 384, 416, 448, 480, 512)
  MIN_SIZE_TEST: 512
  MAX_SIZE_TEST: 512

# =============================================================================
# SOLVER CONFIGURATION
# Optimized for: TransformerDecoder3DHead + Dual ResNet50 (fully trainable)
# Total trainable params: ~82M
# =============================================================================
SOLVER:
  # Optimizer: AdamW is standard for transformers, better than SGD
  TYPE: "adamw"
  
  # Batch size: 128 total (32 per GPU x 4 GPUs)
  # Effective batch size matters for learning rate scaling
  IMS_PER_BATCH: 64
  
  # Learning rate: Linear scaling rule from batch 16 baseline
  # AdamW typically uses 10x lower LR than SGD
  # Base: 1e-4 for batch 16 → 8e-4 for batch 128
  BASE_LR: 0.0004
  
  # Backbone LR multiplier: Train backbone slower than head
  # Prevents destroying pretrained features too quickly
  BACKBONE_MULTIPLIER: 0.1
  
  # Weight decay: Higher for transformers to prevent overfitting
  # AdamW decouples weight decay from gradient update
  WEIGHT_DECAY: 0.05
  
  # Bias and norm parameters should not have weight decay
  WEIGHT_DECAY_NORM: 0.0
  
  # LR Schedule: Cosine annealing (better than step for transformers)
  LR_SCHEDULER_NAME: "WarmupCosineLR"
  
  # Training iterations
  # 52k images, batch 128 → ~406 iters/epoch
  # 50 epochs = ~20k iters, 100 epochs = ~40k iters
  MAX_ITER: 40000
  
  # Warmup: Critical for transformer stability
  # 5 epochs warmup = ~2000 iters
  WARMUP_ITERS: 2000
  WARMUP_FACTOR: 0.001
  WARMUP_METHOD: "linear"
  
  # Gradient clipping: Essential for transformer training stability
  CLIP_GRADIENTS:
    ENABLED: True
    CLIP_TYPE: "norm"
    CLIP_VALUE: 1.0
    NORM_TYPE: 2.0
  
  # Checkpointing
  CHECKPOINT_PERIOD: 4000  # Every ~10 epochs
  
  # AMP: Mixed precision for memory efficiency and speed
  AMP:
    ENABLED: True

# =============================================================================
# TEST CONFIGURATION
# =============================================================================
TEST:
  EVAL_PERIOD: 4000   # Evaluate every ~10 epochs
  
  # Increase test-time proposals for better recall
  DETECTIONS_PER_IMAGE: 100

VIS_PERIOD: 2000

# =============================================================================
# DATALOADER CONFIGURATION
# =============================================================================
DATALOADER:
  NUM_WORKERS: 8  # 2 workers per GPU x 4 GPUs
  
  # RepeatFactor sampler: Oversample rare categories
  SAMPLER_TRAIN: "RepeatFactorTrainingSampler"
  REPEAT_THRESHOLD: 0.1
  
  # Aspect ratio grouping: Batch images with similar aspect ratios
  # Reduces padding waste, improves training efficiency
  ASPECT_RATIO_GROUPING: True
  
  # Filter empty annotations to avoid wasted compute
  FILTER_EMPTY_ANNOTATIONS: True

# Dataset Configuration
DATASETS:
  CATEGORY_NAMES: ('person', 'books', 'chair', 'towel', 'blinds', 'window', 'lamp', 'shelves', 'mirror', 'sink', 'cabinet', 'bathtub', 'door', 'toilet', 'desk', 'box', 'bookcase', 'picture', 'table', 'counter', 'bed', 'night stand', 'dresser', 'pillow', 'sofa', 'television', 'floor mat', 'curtain', 'clothes', 'stationery', 'refrigerator')
  DATA_ROOT: "/mnt/data/users/anweshan/omni3d/data"
  MANIFEST_ROOT: "/mnt/data/users/anweshan/omni3d/data/unidet3d_format/cleaned_manifests"
  TRAIN: ("hypersim_train_rgbd",)
  TRAIN_MANIFEST: "hypersim_train_filtered.json"  # Full training dataset (52k images)
  # TRAIN_MANIFEST: "hypersim_train_sampled.json"  # Sampled for debugging (500 images)
  # VAL: ("hypersim_val_rgbd",)
  TEST: ("hypersim_val_rgbd","sunrgbd_val_rgbd","multiscan_val_rgbd","scannetpp_val_rgbd",)

OUTPUT_DIR: "./output/rgbd_base"
