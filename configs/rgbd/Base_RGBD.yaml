# Base configuration for RGB-D domain-generalized 3D detection
# This config file sets up the dual encoder backbone and RGB-D data loading

_BASE_: "../Base.yaml"

# RGB-D specific model settings
MODEL:
  META_ARCHITECTURE: "RCNN3D_RGBD"
  
  # Enable dual encoder for RGB and depth
  USE_DUAL_ENCODER: True
  
  # RGB encoder settings (fully frozen for domain-invariant features)
  # dgmmod: frozen=True, frozen_stages=4 (all stages frozen)
  RGB_RESNET_DEPTH: 50
  RGB_FROZEN: True
  RGB_FROZEN_STAGES: 4  # Freeze stages 0-4 (conv1, layer1-4)
  
  # Depth encoder settings (partially frozen to adapt to depth modality)
  # dgmmod: frozen=False, frozen_stages=2 (layer3-4 trainable)
  DEPTH_RESNET_DEPTH: 50
  DEPTH_FROZEN: False
  DEPTH_FROZEN_STAGES: 2  # Freeze stages 0-2, train layer3-4
  
  # Fusion type: 'concat', 'add', 'gated'
  FUSION_TYPE: "concat"
  
  # Depth normalization (depth maps are assumed to be in [-1, 1])
  DEPTH_PIXEL_MEAN: 0.0
  DEPTH_PIXEL_STD: 1.0
  
  # Standard pixel normalization for RGB
  PIXEL_MEAN: [103.530, 116.280, 123.675]
  PIXEL_STD: [57.375, 57.120, 58.395]
  
  # FPN settings
  FPN:
    IN_FEATURES: ["res2", "res3", "res4", "res5"]
    OUT_CHANNELS: 256
    NORM: "GN"
    FUSE_TYPE: "sum"
  
  # RPN settings
  RPN:
    IN_FEATURES: ["p2", "p3", "p4", "p5", "p6"]
    PRE_NMS_TOPK_TRAIN: 2000
    PRE_NMS_TOPK_TEST: 1000
    POST_NMS_TOPK_TRAIN: 1000
    POST_NMS_TOPK_TEST: 1000
  
  # ROI settings for 3D detection
  ROI_HEADS:
    NAME: "ROIHeads3D"
    IN_FEATURES: ["p2", "p3", "p4", "p5"]
    IOU_THRESHOLDS: [0.3, 0.5]
    
  ROI_BOX_HEAD:
    NAME: "CubeHead"
    POOLER_TYPE: "ROIAlignV2"
    POOLER_RESOLUTION: 7
    POOLER_SAMPLING_RATIO: 0
    
  # Cube head specific settings
  ROI_CUBE_HEAD:
    USE_CONFIDENCE: True
    CLUSTER_BINS: 1
    Z_TYPE: "direct"
    POSE_TYPE: "6d"
    DIMS_PRIORS_ENABLED: True
    VIRTUAL_DEPTH: True
    VIRTUAL_FOCAL: 512.0
    DISENTANGLED_LOSS: True

# Input settings
INPUT:
  FORMAT: "BGR"
  MIN_SIZE_TRAIN: (640, 672, 704, 736, 768, 800)
  MAX_SIZE_TRAIN: 1333
  MIN_SIZE_TEST: 800
  MAX_SIZE_TEST: 1333

# Solver settings
# =============================================================================
# Omni3D Scaling Rules (from README):
# Base indoor config: IMS_PER_BATCH=128, BASE_LR=0.08, MAX_ITER=116000
# Scale factor r = base_batch / actual_batch = 128 / 16 = 8
# - BASE_LR /= r  -> 0.08 / 8 = 0.01
# - MAX_ITER *= r -> 116000 * 8 = 928000 (capped for practical training)
# - STEPS *= r    -> (69600*8, 92800*8) = (556800, 742400)
# - WARMUP_ITERS *= r -> 3625 * 8 = 29000
# - EVAL_PERIOD *= r  -> 29000 * 8 = 232000 (adjusted for practical eval)
# - VIS_PERIOD *= r   -> 2320 * 8 = 18560
#
# Note: For dual encoder with 4 GPUs, we use batch=16 (4/GPU) as practical target
# Adjust MAX_ITER down to ~200k for reasonable training time
# =============================================================================
SOLVER:
  TYPE: "sgd"
  IMS_PER_BATCH: 16  # 4 images per GPU × 4 GPUs
  BASE_LR: 0.01      # 0.08 / 8 (scale factor r=8)
  STEPS: (120000, 160000)  # Scaled and adjusted for ~200k iters
  MAX_ITER: 200000   # Adjusted from 928k for practical training
  WARMUP_ITERS: 5000 # ~2.5% of max_iter (standard warmup)
  WARMUP_FACTOR: 0.001
  WEIGHT_DECAY: 0.0001
  MOMENTUM: 0.9
  CLIP_GRADIENTS:
    ENABLED: True
    CLIP_TYPE: "norm"
    CLIP_VALUE: 10.0
    NORM_TYPE: 2.0

# Testing
TEST:
  EVAL_PERIOD: 20000  # Evaluate every 20k iters
  DETECTIONS_PER_IMAGE: 100

VIS_PERIOD: 2000

# Domain generalization augmentations
DATALOADER:
  NUM_WORKERS: 4
  SAMPLER_TRAIN: "TrainingSampler"

# =============================================================================
# Dataset Configuration
# =============================================================================
# Data root: /mnt/data/users/anweshan/omni3d/data
# Manifests: /mnt/data/users/anweshan/omni3d/data/unidet3d_format/cleaned_manifests
#
# Manifest format (COCO-style):
#   - images: [{file_path, depth_file_path, K, width, height, scene_type, ...}]
#   - annotations: [{image_id, category_id, bbox_3d, ...}]
#   - categories: [{id, name}]
# =============================================================================
DATASETS:
  # Root directory for all datasets (file_path in manifests are relative to this)
  DATA_ROOT: "/mnt/data/users/anweshan/omni3d/data"
  
  # Manifest directory
  MANIFEST_ROOT: "/mnt/data/users/anweshan/omni3d/data/unidet3d_format/cleaned_manifests"
  
  # Available manifests:
  # - hypersim_train_filtered.json (52461 images, 1908579 annotations, 31 categories)
  # - hypersim_val_filtered.json
  # - sunrgbd_val_filtered.json
  # - multiscan_val_filtered.json
  # - scannetpp_val_filtered.json
  
  # Training datasets
  TRAIN: ("hypersim_train_rgbd",)
  
  # Validation/Test datasets  
  VAL: ("hypersim_val_rgbd",)
  TEST: ("sunrgbd_val_rgbd",)

# Output directory
OUTPUT_DIR: "./output/rgbd_training"
